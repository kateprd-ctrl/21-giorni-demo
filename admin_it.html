function parseCsv(text){
  var lines=text.replace(/\r/g,'').split('\n').filter(function(l){return l.trim()});
  return lines.map(function(l){return l.split(/[;,]/).map(function(x){return x.trim()})});
}

function makeClientsFor(id){
  var n=dists.filter(function(d){return d.id===id})[0].clients;var k=Math.min(10,n||0);
  clients=[];for(var i=0;i<k;i++){var end=[2,9,-2,15,6,22,1,11,4,18][i%10];clients.push({id:i+1,name:'Cliente '+(id*100+i+1),endIn:end,scan:end<=0?'rejected':(i%3===0?'pending':'confirmed'),consent:i%2===0,jar:i%3===1?30:21,paid:i%5===2})}
  makeDrafts();
}
function matchOrders(text){
  var rows=parseCsv(text);if(rows[0]&&/client|cliente/i.test(rows[0][0]))rows=rows.slice(1);
  var res={ok:[],none:[],foreign:[]};
  rows.forEach(function(r){var c=clients.filter(function(x){return x.name===r[0]})[0];
    if(!c){res.foreign.push(r[0]);return}
    if(c.scan==='pending'){c.scan='confirmed';res.ok.push(c.name)}else res.none.push(c.name)});
  logAccess(distName(ME),'Esportazione ordini','Verifica automatica degli ordini: confermate '+res.ok.length);
  S.ordersResult=res;render();toast('Verifica completata');
}
function copyText(t,cb){
  try{navigator.clipboard.writeText(t).then(cb,function(){fallbackCopy(t)})}catch(e){fallbackCopy(t)}
}
function fallbackCopy(t){modal('<h2 style="margin-top:0">Copia a mano</h2><textarea readonly style="min-height:140px">'+esc(t)+'</textarea><div class="row" style="margin-top:10px"><button class="b n" id="mNo">Chiudi</button></div>');$('#mNo').onclick=closeModal}
render();
})();
</script>
